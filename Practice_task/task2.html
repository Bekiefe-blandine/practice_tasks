<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>How to Cook Rice</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <div class="p-6">

        <h1 class="text-4xl font-bold text-center text-green-600">
            How to Cook Rice
        </h1>

        <h2 class="text-xl text-center text-gray-600">
            Easy Rice Recipe
        </h2>

        <p class="text-lg text-gray-700 mt-4">
            Wash the rice and put it in a pot with water.
        </p>

        <p class="text-lg text-gray-700 mt-4">
            Add salt and cook until the rice becomes soft.
        </p>

        <p class="bg-yellow-200 p-4 mt-4 font-bold text-green-800">
            Tip: Cover the rice and let it rest for 5 minutes before serving.
        </p>

    </div>

</body>
</html>
